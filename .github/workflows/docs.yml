name: Trigger Website Rebuild (Docs Updated)

on:
  push:
    branches: [main]
    paths: ['docs/**', '.github/workflows/docs.yml']

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Check adapter documentation coverage
        run: bash scripts/check-doc-coverage.sh --strict
      - name: Build documentation
        run: npm run docs:build

  dispatch:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Check website deployment configuration
        id: config
        env:
          WEBSITE_DEPLOY_TOKEN: ${{ secrets.WEBSITE_DEPLOY_TOKEN }}
        run: |
          if [ -n "$WEBSITE_DEPLOY_TOKEN" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning::WEBSITE_DEPLOY_TOKEN is not configured. Documentation validation passed; website rebuild was not requested."
            echo "Website rebuild skipped: WEBSITE_DEPLOY_TOKEN is not configured. Documentation was validated; the website was not deployed." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Trigger bycli-website rebuild
        if: steps.config.outputs.configured == 'true'
        uses: peter-evans/repository-dispatch@v4
        with:
          token: ${{ secrets.WEBSITE_DEPLOY_TOKEN }}
          repository: sovovs/byCLI-website
          event-type: docs-updated
